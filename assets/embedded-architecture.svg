<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">嵌入式系统分层结构</title><desc id="desc">应用、服务和RTOS、驱动、硬件外设，以及贯穿各层的配置构建测试</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs><rect width="1000" height="700" rx="28" fill="url(#bg)"/><text x="500" y="52" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#0f172a">嵌入式系统：软件与硬件协同</text><text x="500" y="82" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#475569">分层是职责边界，不代表所有项目都采用相同实现</text><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><rect x="200" y="120" width="600" height="92" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="500" y="156" font-size="24" font-weight="700" fill="#1e3a8a">应用层 / 控制逻辑</text><text x="500" y="184" font-size="16" fill="#1d4ed8">功能需求 · 状态机 · 控制算法 · 故障策略</text><rect x="200" y="236" width="600" height="92" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="500" y="272" font-size="24" font-weight="700" fill="#14532d">服务层 / RTOS / 中间件</text><text x="500" y="300" font-size="16" fill="#166534">任务调度 · 同步机制 · 通信服务 · 诊断服务</text><rect x="200" y="352" width="600" height="92" rx="18" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/><text x="500" y="388" font-size="24" font-weight="700" fill="#78350f">驱动层 / 硬件抽象</text><text x="500" y="416" font-size="16" fill="#92400e">GPIO · ADC · PWM · CAN · SPI · UART</text><rect x="200" y="468" width="600" height="92" rx="18" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text x="500" y="504" font-size="24" font-weight="700" fill="#581c87">硬件层 / MCU / SoC</text><text x="500" y="532" font-size="16" fill="#6b21a8">CPU · RAM/Flash · 定时器 · 外设控制器</text><path d="M500 212 V229 M500 328 V345 M500 444 V461" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="70" y="590" width="860" height="68" rx="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="500" y="618" font-size="20" font-weight="700" fill="#334155">贯穿全流程：需求追踪 · 配置管理 · 构建 · 测试 · 调试 · 版本记录</text><text x="500" y="641" font-size="14" fill="#475569">故障排查从系统边界逐层定位，并用日志、测量与可重复实验验证结论</text></g></svg>