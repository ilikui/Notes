<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">高等数学学习地图</title><desc id="desc">函数与映射、极限与连续、导数与微分、积分与累积、微分方程的关联学习路线</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs><rect width="1100" height="420" rx="26" fill="url(#bg)"/><text x="550" y="48" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#0f172a">高等数学：从变化到累积</text><text x="550" y="76" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#475569">每个主题都需要定义、直觉、推导、例题与反例</text><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><rect x="40" y="130" width="180" height="110" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="130" y="166" font-size="22" font-weight="700" fill="#1e3a8a">函数与映射</text><text x="130" y="193" font-size="15" fill="#1d4ed8">定义域 · 值域</text><text x="130" y="215" font-size="15" fill="#1d4ed8">变化关系</text><rect x="255" y="130" width="180" height="110" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="345" y="166" font-size="22" font-weight="700" fill="#14532d">极限与连续</text><text x="345" y="193" font-size="15" fill="#166534">ε-δ / ε-N</text><text x="345" y="215" font-size="15" fill="#166534">逼近与稳定性</text><rect x="470" y="130" width="180" height="110" rx="18" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/><text x="560" y="166" font-size="22" font-weight="700" fill="#78350f">导数与微分</text><text x="560" y="193" font-size="15" fill="#92400e">瞬时变化率</text><text x="560" y="215" font-size="15" fill="#92400e">局部线性近似</text><rect x="685" y="130" width="180" height="110" rx="18" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text x="775" y="166" font-size="22" font-weight="700" fill="#581c87">积分与累积</text><text x="775" y="193" font-size="15" fill="#6b21a8">面积 · 总量</text><text x="775" y="215" font-size="15" fill="#6b21a8">微积分基本定理</text><rect x="900" y="130" width="160" height="110" rx="18" fill="#ffe4e6" stroke="#fb7185" stroke-width="2"/><text x="980" y="166" font-size="22" font-weight="700" fill="#881337">微分方程</text><text x="980" y="193" font-size="15" fill="#9f1239">变化规律</text><text x="980" y="215" font-size="15" fill="#9f1239">模型与预测</text></g><g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M220 185 H247"/><path d="M435 185 H462"/><path d="M650 185 H677"/><path d="M865 185 H892"/></g><rect x="95" y="290" width="910" height="70" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="550" y="319" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#334155">学习闭环：定义 → 直觉/图像 → 推导 → 例题 → 反例 → 应用</text><text x="550" y="344" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#64748b">数学图示用于建立联系；严谨结论仍需满足定义与定理条件</text></svg>