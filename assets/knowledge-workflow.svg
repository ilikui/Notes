<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">个人知识库工作流</title><desc id="desc">从收集、理解、提炼、关联、实践到复盘的循环</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8ff"/><stop offset="1" stop-color="#eefaf6"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs><rect width="1200" height="440" rx="28" fill="url(#bg)"/><text x="600" y="54" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#172554">让信息成为可复用的知识</text><text x="600" y="84" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#475569">每一步都留下证据、链接与下一步行动</text><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><g><rect x="45" y="145" width="160" height="100" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="125" y="184" font-size="23" font-weight="700" fill="#1e3a8a">01 收集</text><text x="125" y="214" font-size="15" fill="#1e40af">问题 · 来源 · 观察</text></g><g><rect x="245" y="145" width="160" height="100" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="325" y="184" font-size="23" font-weight="700" fill="#14532d">02 理解</text><text x="325" y="214" font-size="15" fill="#166534">解释 · 例子 · 机制</text></g><g><rect x="445" y="145" width="160" height="100" rx="18" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/><text x="525" y="184" font-size="23" font-weight="700" fill="#78350f">03 提炼</text><text x="525" y="214" font-size="15" fill="#92400e">独立观点 · 边界</text></g><g><rect x="645" y="145" width="160" height="100" rx="18" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text x="725" y="184" font-size="23" font-weight="700" fill="#581c87">04 关联</text><text x="725" y="214" font-size="15" fill="#6b21a8">前置 · 反例 · 应用</text></g><g><rect x="845" y="145" width="150" height="100" rx="18" fill="#ffe4e6" stroke="#fb7185" stroke-width="2"/><text x="920" y="184" font-size="23" font-weight="700" fill="#881337">05 实践</text><text x="920" y="214" font-size="15" fill="#9f1239">实验 · 写作 · 项目</text></g><g><rect x="1035" y="145" width="130" height="100" rx="18" fill="#cffafe" stroke="#22d3ee" stroke-width="2"/><text x="1100" y="184" font-size="23" font-weight="700" fill="#164e63">06 复盘</text><text x="1100" y="214" font-size="15" fill="#155e75">修订 · 更新</text></g></g><g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M205 195 H237"/><path d="M405 195 H437"/><path d="M605 195 H637"/><path d="M805 195 H837"/><path d="M995 195 H1027"/><path d="M1100 250 V305 H525 V255"/></g><rect x="350" y="318" width="350" height="62" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="525" y="344" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#334155">遇到新证据，就更新旧理解</text><text x="525" y="365" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#64748b">知识库是持续迭代的系统，而不是收藏终点</text></svg>