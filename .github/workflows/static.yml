# This is a basic workflow to help you get started with GitHub Actions

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deployments so concurrent runs cannot race while updating gh-pages.
concurrency:
  group: github-pages-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: write
  checks: write
  contents: write
  deployments: write
  id-token: write
  issues: write
  discussions: write
  packages: write
  pages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Logseq Publish 🚩
        uses: logseq/publish-spa@main

      # Book covers are stored outside Logseq's managed assets directory.
      # Copy them into the generated site so both GitHub Pages and Cloudflare
      # static assets can serve /assets/books/<book-id>.jpg.
      - name: Include book cover assets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/www/assets/books"
          cp -a "$GITHUB_WORKSPACE/assets/books/." "$GITHUB_WORKSPACE/www/assets/books/"

      - name: Add a nojekyll file
        run: touch "$GITHUB_WORKSPACE/www/.nojekyll"

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: www
          clean: true
          single-commit: true
